title: "Self-sealing Airlocks (Continued)"
description: "Airlocks (all doors except the pneumatic door) stay airtight while set to Auto or Locked: gases and liquids can't pass even when a duplicant walks through. Set a door to Open to let gas and liquid through. Rebuilt for the current game. Continues Self-sealing Airlocks by chromiumboy, Self-sealing Airlocks Revived by LoneMarauder, and Revived V2 by yohan-id. GPL-3.0."
staticID: "selfSealingAirlocksContinued"
